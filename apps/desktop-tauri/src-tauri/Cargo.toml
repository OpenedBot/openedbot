[package]
name = "openedbot-desktop-preview"
version = "0.0.0"
description = "openedbot desktop, Tauri 2 prototype (ADR 0001, D2a)"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "openedbot_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2.7"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
keyring = { version = "3.6", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "macros", "rt"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
log = "0.4"
time = { version = "0.3", features = ["parsing", "formatting"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
