<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` : sur Chromium Android le clavier
      rétrécit le viewport de mise en page, et le composer reste au-dessus de
      lui sans calcul. Safari iOS l'ignore ; `use-visual-viewport-height.ts`
      y fait le même travail à la main.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!--
      `color-scheme` + fond inline : le moteur peint le fond AVANT le CSS
      bundle, sinon la fenêtre s'ouvre dans une couleur puis bascule (le
      « flash »). Le CLAIR est la base et le sombre l'exception, comme
      DEFAULT_MODE dans `browser/ui-kit/src/theme/config.ts` : les deux doivent bouger
      ensemble. Les deux `theme-color` ci-dessous ne servent qu'au premier
      rendu ; `browser/ui-kit/src/theme/context.tsx` les réécrit ensuite avec la couleur
      RÉSOLUE.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <meta name="apple-mobile-web-app-title" content="openedbot" />
    <link rel="icon" href="/favicon.ico?v=owl-blue" sizes="16x16 32x32 48x48" />
    <!-- Mesure d'audience : Umami auto-hébergé, sans cookie. -->
    <script defer src="https://umami.pulseview.app/script.js" data-website-id="97980bd4-f239-418e-859f-72b1abe31c31"></script>
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=owl-blue" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png?v=owl-blue" />
    <title>openedbot</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ohb:theme");
          // « light » et non « system » : le même défaut que DEFAULT_MODE dans
          // `browser/ui-kit/src/theme/config.ts`. Les deux doivent bouger ensemble, sinon
          // la page est peinte dans une couleur que React remplace aussitôt.
          var mode = raw ? JSON.parse(raw).mode : "light";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          // Sans localStorage : le clair, qui est déjà la couleur de base.
        }
      })();
      // Réglages › Apparence › Taille du texte, avant la première peinture :
      // la coque de bureau zoome la fenêtre d'après cet attribut. Posé par
      // `main.tsx` seulement, il arrivait après la silhouette, peinte à 100 %
      // puis rétrécie d'un coup. Jumeau de `src/lib/text-size.ts` (clé,
      // tailles, défaut 11, base 14).
      (function () {
        var size = 11;
        try {
          var stored = Number(localStorage.getItem("ohb:settings-text-size"));
          if ([10, 11, 12, 13, 14].indexOf(stored) >= 0) size = stored;
        } catch (e) {
          // Stockage refusé : la taille par défaut.
        }
        document.documentElement.setAttribute("data-ohb-text-zoom", String(size / 14));
      })();
      // La silhouette du cadre (`#ohb-boot`, plus bas) ne se montre qu'à qui
      // entre DANS l'application : une session existe (navigateur, ou pont de
      // la coque native posé par son preload avant ce script) et le chemin
      // n'est pas une page publique ni un parcours sans barre latérale.
      // `main.tsx` la retire au premier rendu du routeur.
      (function () {
        // Match nativeTitlebarFor without setting the app's titlebar attribute.
        if (window.__OHB_NATIVE__) {
          var nativeTitlebar = /^Mac/.test(navigator.platform) || /Macintosh/.test(navigator.userAgent) ? "mac"
            : /^Win/.test(navigator.platform) || /Windows/.test(navigator.userAgent) ? "windows" : null;
          if (nativeTitlebar) document.documentElement.setAttribute("data-ohb-boot-titlebar", nativeTitlebar);
        }
        try {
          var path = location.pathname;
          var outside = /(^|\/)(login|legal|change-password|onboarding)(\/|$)/.test(path);
          var session = !!window.__OHB_NATIVE__ || !!localStorage.getItem("ohb:cloud-session");
          // `/` is the app on every host (the public page lives on the public
          // site, `src/lib/public-site.ts`): it gets the app silhouette too.
          if (session && !outside) document.documentElement.setAttribute("data-ohb-booting", "");
          // Fleet addresses (twin of FLEET_ADDRESS in the agency console module)
          // and client addresses share the agency frame (rail, bar, client list).
          var fleet = /^\/(?:fleets|(?:o\/[^/]+\/)?fleet)(?:\/|$)/.test(path);
          var fleetClient = /^\/o\/[^/]+\/clients\/[^/]+(?:\/|$)/.test(path);
          // `/` opens an agency's fleet when the tab's organization is an own
          // agency (`route-tree.tsx`, index route): read it from the same
          // stores as `lib/cloud-session.ts` and `lib/workspace-directory.ts`.
          var directory = JSON.parse(sessionStorage.getItem("ohb:workspace-directory") || "{}");
          function ownFleet(key) {
            var wanted = String(key).toLowerCase();
            var found = (directory.workspaces || []).filter(function (w) {
              return String(w.id).toLowerCase() === wanted || String(w.slug).toLowerCase() === wanted;
            })[0];
            return !!found && found.kind === "agency" && found.role !== "agency";
          }
          var stored = JSON.parse(localStorage.getItem("ohb:cloud-session") || "{}");
          var tabOrganization = sessionStorage.getItem("ohb:workspace:" + (stored.userId || stored.csrfToken));
          var activeOrganization = tabOrganization || stored.organizationId;
          if (!fleet && path === "/" && session) fleet = ownFleet(activeOrganization);
          // Any other app address of an own agency draws the agency frame too:
          // its team and profile, and the routes it shares with a personal
          // workspace (`/support`, `/inbox`, `/settings/...`), with or without
          // the `/o/<agency>` prefix. Twin of `activeOwnFleetHint` in
          // the agency console module (`agency-hint.ts`) and `fleetAccountInPath` in
          // `src/lib/workspace-location.ts`.
          var framed = path.match(/^\/o\/([^/]+)(\/.*)?$/i);
          var fleetAccount = !fleet && !fleetClient && session && !outside
            && (framed ? !!framed[2] && framed[2] !== "/" && ownFleet(framed[1]) : path !== "/" && ownFleet(activeOrganization));
          if (fleet || fleetClient || fleetAccount) document.documentElement.setAttribute("data-ohb-boot-fleet", "");
          // No fleet board cards in the main card: it holds a client or account page.
          if (fleetClient || fleetAccount) document.documentElement.setAttribute("data-ohb-boot-fleet-client", "");
          // L'accent choisi, pour que le « + » du décor ait déjà sa couleur
          // (`paintStoredTheme` le repose ensuite, même attribut, même valeur).
          var theme = JSON.parse(localStorage.getItem("ohb:theme") || "{}");
          if (typeof theme.accent === "string") document.documentElement.setAttribute("data-accent", theme.accent);
          // La barre latérale repliée (`board-chrome.tsx`) : la silhouette aussi.
          if (localStorage.getItem("ohb:sidebar-collapsed") === "1") document.documentElement.setAttribute("data-ohb-sidebar-collapsed", "");
          // La disposition C, celle par défaut : le rail d'icônes de
          // `BoardIconRail`. Jumeau de `readAccountLayout` dans
          // `src/lib/account-layout.ts` (clé, valeurs, défaut) : une valeur
          // absente ou inconnue vaut « c ». L'ancienne clé de dev
          // (`ohb.dev.accountLayout`) dessinait la coque sans rail alors que
          // l'application, elle, en avait un.
          var layout = localStorage.getItem("ohb:accountLayout");
          if (["base", "a", "b", "c"].indexOf(layout) < 0) layout = "c";
          if (layout === "c" && !(fleet || fleetClient || fleetAccount)) document.documentElement.setAttribute("data-ohb-boot-rail", "");
        } catch (e) {
          // Sans localStorage : pas de silhouette, la page reste unie.
        }
      })();
    </script>

      html, body {
        margin: 0;
        background: #ffffff;

      /*
        La silhouette du cadre BoardUI pendant le chargement du JS : sans elle,
        la page restait blanche plus d'une seconde avant que React ne monte.
        Même géométrie que le vrai cadre et que `AppFrameSkeleton`
        (`components/skeletons/frame-skeletons.tsx`), qui prend le relais
        pendant les gardes : les deux doivent bouger ensemble, sinon le passage
        de l'une à l'autre se voit.
        - Barre du haut de 46 px (`BoardTopBar`) : l'organisation, le repli,
          Précédent et Suivant, puis sur une conversation le fil d'Ariane
          (« Salon › visage nom ») et ses actions.
        - Barre latérale de 272 px (marge gauche de 12 px) : une carte grise
          au rayon 24 et au liseré blanc (`BOARD_SIDEBAR_CARD`), ses trois
          boutons, les liens Salon et À traiter avec leur libellé, puis le
          roster dessiné d'après sa dernière forme (`ohb:boot-sidebar`,
          `lib/boot-shape.ts`) : tuiles épinglées, intitulés de section,
          rangées de 44 px. La ligne du compte de 50 px en bas.
        - Carte principale grise au rayon 24, sans bord ni ombre ; sur
          `/bot/:id` ou `/g/:id`, la colonne de lecture du fil (48rem, 56rem
          au-delà de 100rem), ses messages et le composer.
        Les couleurs sont les jetons `--bui-*` de `styles/components/boardui.css`
        et les rampes `--accent-*` de `browser/ui-kit/src/styles/app.css`,
        recopiés ici parce que ces CSS ne sont pas encore chargés.

        Seul ce qui DÉPEND DE DONNÉES pulse (`i`). Le décor toujours identique
        (boutons, icônes, libellés de navigation, accent choisi) est peint tel
        qu'il sera (`b`).
      */

        --a600: #155dfc;

      /* La colonne de lecture (`data-thread-column`, thread-timeline.css). */
      #ohb-boot .thread {
        flex: 1;
        flex-direction: column;
        justify-content: flex-end;
        gap: 12px;
        min-height: 0;
        padding: 16px 24px;
        overflow: hidden;
      }
      #ohb-boot .turn {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: var(--boot-column);
        margin-inline: auto;
      }
      #ohb-boot .ask {
        align-self: flex-end;
        max-width: 80%;
        height: 42px;
        border-radius: 16px;
      }
      #ohb-boot .answer {
        display: grid;
        gap: 8px;
        padding-top: 4px;
      }
      #ohb-boot .answer i:first-child {
        max-width: 100%;
        height: 16px;
      }
      #ohb-boot .answer i:last-child {
        width: 40px;
        height: 12px;
      }
      #ohb-boot .composer {
        padding: 8px 24px 16px;
      }
      #ohb-boot .shell {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        max-width: calc(var(--boot-column) + 0.5rem);
        margin-inline: auto;
        padding: 6px 8px;
        border-radius: 24px;
        background: var(--boot-raised);
        box-shadow: 0 1px 2px 0 #0000000d;
      }
      #ohb-boot .shell .line {
        height: 28px;
        margin: 6px 0;
        border-radius: 12px;
      }
      #ohb-boot .shell .tools {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #ohb-boot .shell .dot {
        width: 32px;
        height: 32px;
      }
      #ohb-boot .shell .chip {
        width: 80px;
        height: 24px;
      }
      #ohb-boot .shell .gap {
        flex: 1;
      }
      /* Barre latérale repliée : sa rangée d'outils monte dans la barre du haut. */
      html[data-ohb-sidebar-collapsed] #ohb-boot .side,
      html[data-ohb-sidebar-collapsed] #ohb-boot .org {
        display: none;
      }
      html[data-ohb-sidebar-collapsed] #ohb-boot .bartools {
        display: flex;
      }
      /* Variante C (dev) : le rail de 56 px sur toute la hauteur (`BoardIconRail`,
         board-rails.tsx), sans organisation dans la barre ; en tête de liste,
         la recherche et le « + », Salon et À traiter passent dans le rail. */
      #ohb-boot .brail {
        display: none;
      }
      html[data-ohb-boot-rail] #ohb-boot {
        padding-inline-start: 56px;
      }
      html[data-ohb-boot-rail] #ohb-boot .brail {
        position: absolute;
        inset-block: 0;
        inset-inline-start: 0;
        display: flex;
        width: 56px;
        flex-direction: column;
        align-items: center;
        padding-bottom: 12px;
      }
      #ohb-boot .brail .logo {
        display: flex;
        flex: 0 0 46px;
        align-items: center;
      }
      #ohb-boot .brail .grp {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #ohb-boot .brail .grp b {
        display: flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        color: var(--boot-icon);
      }
      #ohb-boot .brail svg {
        width: 18px;
        height: 18px;
      }
      #ohb-boot .brail .gap {
        flex: 1;
      }
      html[data-ohb-boot-rail] #ohb-boot .org,
      html[data-ohb-boot-rail] #ohb-boot .nav,
      html[data-ohb-boot-rail] #ohb-boot .foot {
        display: none;
      }
      html[data-ohb-boot-rail] #ohb-boot .side {
        padding-inline-start: 0;
      }
      html[data-ohb-boot-rail] #ohb-boot .top {
        display: flex;
        margin-bottom: 4px;
      }
      html[data-ohb-boot-rail] #ohb-boot .top b {
        height: 32px;
        border-radius: 8px;
      }
      html[data-ohb-boot-rail] #ohb-boot .top b.search {
        flex: 1;
        justify-content: flex-start;
        padding-inline-start: 10px;
      }
      html[data-ohb-boot-rail] #ohb-boot .top b.create {
        flex: 0 0 32px;
      }
      html[data-ohb-boot-rail] #ohb-boot .top svg {
        width: 16px;
        height: 16px;
      }
      /* Téléphone : `MobileFrame` range la barre dans un tiroir, la scène occupe tout. */
      @media (max-width: 767px) {
        #ohb-boot .bar,
        #ohb-boot .side,
        html[data-ohb-boot-rail] #ohb-boot .brail {
          display: none;
        }
        html[data-ohb-boot-rail] #ohb-boot {
          padding-inline-start: 0;
        }
        #ohb-boot .main {
          padding: 0;
        }
        #ohb-boot .scene {
          border-radius: 0;
        }
        #ohb-boot.conv .thread,
        #ohb-boot.conv .composer {
          display: none;
        }
      }
      @keyframes ohb-boot-pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #ohb-boot i {
          animation: none;
        }
      }
    </style>
  </head>

          <div class="fmain"><i style="width:220px;height:28px"></i><div class="cards"><div class="tile"><i style="width:45%;height:14px"></i><i style="width:30%;height:22px"></i><i style="width:70%;height:10px"></i></div><div class="tile"><i style="width:45%;height:14px"></i><i style="width:30%;height:22px"></i><i style="width:70%;height:10px"></i></div><div class="tile"><i style="width:45%;height:14px"></i><i style="width:30%;height:22px"></i><i style="width:70%;height:10px"></i></div></div><div class="cards clients"><div class="tile"><i style="width:55%;height:14px"></i><i class="round" style="width:84px;height:18px"></i><i style="width:80%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:60%;height:30px"></i></div><div class="tile"><i style="width:55%;height:14px"></i><i class="round" style="width:84px;height:18px"></i><i style="width:80%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:60%;height:30px"></i></div><div class="tile"><i style="width:55%;height:14px"></i><i class="round" style="width:84px;height:18px"></i><i style="width:80%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:100%;height:10px"></i><i style="width:60%;height:30px"></i></div></div></div>

    </div>
    <script>
      // Ce que la page ne connaît qu'au chargement : la langue des libellés,
      // la forme du dernier roster (`lib/boot-shape.ts`, mêmes bornes) et si
      // l'adresse est une conversation (`isConversationPath`).
      (function () {
        var boot = document.getElementById("ohb-boot");
        if (!boot) return;
        try {
          var locale = localStorage.getItem("ohb:locale") || (navigator.language || "").slice(0, 2).toLowerCase();
          if (locale === "en") {
            boot.setAttribute("aria-label", "Loading");
            boot.querySelector(".inbox").textContent = "Inbox";
          }
          if (/\/(?:bot|g)\/[^/]+\/?$/.test(location.pathname)) boot.className = "conv";
          try {
            var identity = JSON.parse(localStorage.getItem("ohb:boot-identity") || "null");
            var session = JSON.parse(localStorage.getItem("ohb:cloud-session") || "null");
            var orgSlot = boot.querySelector(".org i");
            if (orgSlot && identity && session && typeof identity.label === "string" && identity.label
              && typeof identity.userId === "string" && identity.userId === session.userId) {
              var orgName = document.createElement("span");
              orgName.className = "orgname";
              orgName.textContent = identity.label.slice(0, 64);
              orgSlot.replaceWith(orgName);
            }
          } catch (e) { /* the label keeps pulsing */ }
          var shape = null;
          try { shape = JSON.parse(localStorage.getItem("ohb:boot-sidebar") || "null"); } catch (e) { shape = null; }
          if (!shape || typeof shape.pins !== "number" || !Array.isArray(shape.blocks)) shape = { pins: 0, blocks: [{ label: true, rows: 5 }] };
          var rows = boot.querySelector(".rows");
          var html = "";
          var pins = Math.max(0, Math.min(Math.floor(shape.pins), 6));
          if (pins > 0) {
            html += '<div class="pins">';
            for (var p = 0; p < pins; p++) html += '<div class="pin"><i class="face"></i><i style="width:64px;height:14px"></i></div>';
            html += "</div>";
          }
          var left = 18;
          for (var b = 0; b < shape.blocks.length && left > 0; b++) {
            var block = shape.blocks[b] || {};
            var count = Math.max(0, Math.min(Math.floor(Number(block.rows) || 0), left));
            left -= count;
            html += '<div class="block">';
            if (block.label === true) html += '<div class="label"><i style="width:64px;height:12px"></i></div>';
            for (var r = 0; r < count; r++) html += '<div class="row"><i class="face"></i><div class="lines"><i class="l1"></i><i class="l2"></i></div></div>';
            html += "</div>";
          }
          rows.innerHTML = html;
        } catch (e) {
          // Sans localStorage : la forme par défaut, cinq rangées sous un intitulé.
          var fallback = '<div class="block"><div class="label"><i style="width:64px;height:12px"></i></div>';
          for (var d = 0; d < 5; d++) fallback += '<div class="row"><i class="face"></i><div class="lines"><i class="l1"></i><i class="l2"></i></div></div>';
          boot.querySelector(".rows").innerHTML = fallback + "</div>";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
