<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` : sur Chromium Android le clavier
      rétrécit le viewport de mise en page, et le composer reste au-dessus de
      lui sans calcul. Safari iOS l'ignore ; `use-visual-viewport-height.ts`
      y fait le même travail à la main.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!--
      `color-scheme` + fond inline : le moteur peint le fond AVANT le CSS
      bundle, sinon la fenêtre s'ouvre dans une couleur puis bascule (le
      « flash »). Le CLAIR est la base et le sombre l'exception, comme
      DEFAULT_MODE dans `browser/ui-kit/src/theme/config.ts` : les deux doivent bouger
      ensemble. Les deux `theme-color` ci-dessous ne servent qu'au premier
      rendu ; `browser/ui-kit/src/theme/context.tsx` les réécrit ensuite avec la couleur
      RÉSOLUE.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <link rel="icon" href="/favicon.ico?v=bloub2" sizes="16x16 32x32 48x48" />
    <!-- Mesure d'audience : Umami auto-hébergé, sans cookie. -->
    <script defer src="https://umami.pulseview.app/script.js" data-website-id="97980bd4-f239-418e-859f-72b1abe31c31"></script>
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=bloub2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=bloub2" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png?v=bloub2" />
    <title>openedbot</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("openedbot:theme");
          // « light » et non « system » : le même défaut que DEFAULT_MODE dans
          // `browser/ui-kit/src/theme/config.ts`. Les deux doivent bouger ensemble, sinon
          // la page est peinte dans une couleur que React remplace aussitôt.
          var mode = raw ? JSON.parse(raw).mode : "light";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          // Sans localStorage : le clair, qui est déjà la couleur de base.
        }
      })();
      // Réglages › Apparence › Taille du texte, avant la première peinture :
      // la coque de bureau zoome la fenêtre d'après cet attribut. Posé par
      // `main.tsx` seulement, il arrivait après la silhouette, peinte à 100 %
      // puis rétrécie d'un coup. Jumeau de `src/lib/shell/text-size.ts` (clé,
      // tailles, défaut 11, base 14).
      (function () {
        var size = 11;
        try {
          var stored = Number(localStorage.getItem("openedbot:settings-text-size"));
          if ([10, 11, 12, 13, 14].indexOf(stored) >= 0) size = stored;
        } catch (e) {
          // Stockage refusé : la taille par défaut.
        }
        document.documentElement.setAttribute("data-openedbot-text-zoom", String(size / 14));
      })();
      // La silhouette du cadre (`#openedbot-boot`, plus bas) ne se montre qu'à qui
      // entre DANS l'application : une session existe (navigateur, ou pont de
      // la coque native posé par son preload avant ce script) et le chemin
      // n'est pas une page publique ni un parcours sans barre latérale.
      // `main.tsx` la retire au premier rendu du routeur.
      (function () {
        // Match nativeTitlebarFor without setting the app's titlebar attribute.
        if (window.__OPENEDBOT_NATIVE__) {
          var nativeTitlebar = /^Mac/.test(navigator.platform) || /Macintosh/.test(navigator.userAgent) ? "mac"
            : /^Win/.test(navigator.platform) || /Windows/.test(navigator.userAgent) ? "windows" : null;
          if (nativeTitlebar) document.documentElement.setAttribute("data-openedbot-boot-titlebar", nativeTitlebar);
        }
        try {
          var path = location.pathname;
          var outside = /(^|\/)(login|legal|change-password|onboarding)(\/|$)/.test(path);
          var session = !!window.__OPENEDBOT_NATIVE__ || !!localStorage.getItem("openedbot:cloud-session");
          // `/` is the app on every host (the public page lives on the public
          // site, `src/lib/session/public-site.ts`): it gets the app silhouette too.
          if (session && !outside) document.documentElement.setAttribute("data-openedbot-booting", "");
          // Fleet addresses (twin of FLEET_ADDRESS in the agency console module)
          // and client addresses share the agency frame (rail, bar, client list).
          var fleet = /^\/(?:fleets|(?:o\/[^/]+\/)?fleet)(?:\/|$)/.test(path);
          var fleetClient = /^\/o\/[^/]+\/clients\/[^/]+(?:\/|$)/.test(path);
          // `/` opens an agency's fleet when the tab's organization is an own
          // agency (`route-tree.tsx`, index route): read it from the same
          // stores as `lib/session/cloud-session.ts` and `lib/workspace/workspace-directory.ts`.
          var directory = JSON.parse(sessionStorage.getItem("openedbot:workspace-directory") || "{}");
          function ownFleet(key) {
            var wanted = String(key).toLowerCase();
            var found = (directory.workspaces || []).filter(function (w) {
              return String(w.id).toLowerCase() === wanted || String(w.slug).toLowerCase() === wanted;
            })[0];
            return !!found && found.kind === "agency" && found.role !== "agency";
          }
          var stored = JSON.parse(localStorage.getItem("openedbot:cloud-session") || "{}");
          var tabOrganization = sessionStorage.getItem("openedbot:workspace:" + (stored.userId || stored.csrfToken));
          var activeOrganization = tabOrganization || stored.organizationId;
          if (!fleet && path === "/" && session) fleet = ownFleet(activeOrganization);
          // Any other app address of an own agency draws the agency frame too:
          // its team and profile, and the routes it shares with a personal
          // workspace (`/support`, `/inbox`, `/settings/...`), with or without
          // the `/o/<agency>` prefix. Twin of `activeOwnFleetHint` in
          // the agency console module (`agency-hint.ts`) and `fleetAccountInPath` in
          // `src/lib/workspace/workspace-location.ts`.
          var framed = path.match(/^\/o\/([^/]+)(\/.*)?$/i);
          var fleetAccount = !fleet && !fleetClient && session && !outside
            && (framed ? !!framed[2] && framed[2] !== "/" && ownFleet(framed[1]) : path !== "/" && ownFleet(activeOrganization));
          if (fleet || fleetClient || fleetAccount) document.documentElement.setAttribute("data-openedbot-boot-fleet", "");
          // No fleet board cards in the main card: it holds a client or account page.
          if (fleetClient || fleetAccount) document.documentElement.setAttribute("data-openedbot-boot-fleet-client", "");
          // L'accent choisi, posé dès le décor : le premier rendu React l'a déjà
          // (`paintStoredTheme` le repose ensuite, même attribut, même valeur).
          var theme = JSON.parse(localStorage.getItem("openedbot:theme") || "{}");
          if (typeof theme.accent === "string") document.documentElement.setAttribute("data-accent", theme.accent);
          // La barre latérale repliée (`board-chrome.tsx`) : la silhouette aussi.
          if (localStorage.getItem("openedbot:sidebar-collapsed") === "1") document.documentElement.setAttribute("data-openedbot-sidebar-collapsed", "");
          // La disposition C, celle par défaut : le rail d'icônes de
          // `BoardIconRail`. Jumeau de `readAccountLayout` dans
          // `src/lib/shell/account-layout.ts` (clé, valeurs, défaut) : une valeur
          // absente ou inconnue vaut « c ». L'ancienne clé de dev
          // (`openedbot.dev.accountLayout`) dessinait la coque sans rail alors que
          // l'application, elle, en avait un.
          var layout = localStorage.getItem("openedbot:accountLayout");
          if (["base", "a", "b", "c"].indexOf(layout) < 0) layout = "c";
          if (layout === "c" && !(fleet || fleetClient || fleetAccount)) document.documentElement.setAttribute("data-openedbot-boot-rail", "");
        } catch (e) {
          // Sans localStorage : pas de silhouette, la page reste unie.
        }
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        background: #ffffff;
        color: #15140f;
      }
      html.dark,
      html.dark body {
        background: #121212;
        color: #f5f4ef;

      /*
        La silhouette du cadre BoardUI pendant le chargement du JS : sans elle,
        la page restait blanche plus d'une seconde avant que React ne monte.
        Même géométrie que le vrai cadre et que `AppFrameSkeleton`
        (`components/skeletons/frame-skeletons.tsx`), qui prend le relais
        pendant les gardes : les deux doivent bouger ensemble, sinon le passage
        de l'une à l'autre se voit.
        - Barre du haut de 46 px (`BoardTopBar`) : l'organisation, le repli,
          Précédent et Suivant, puis sur une conversation le fil d'Ariane
          (« Salon › visage nom ») et ses actions.
        - Barre latérale de 272 px (marge gauche de 12 px) : une carte grise
          au rayon 24 et au liseré blanc (`BOARD_SIDEBAR_CARD`), ses trois
          boutons, les liens Salon et À traiter avec leur libellé, puis le
          roster dessiné d'après sa dernière forme (`openedbot:boot-sidebar`,
          `lib/session/boot-shape.ts`) : tuiles épinglées, intitulés de section,
          rangées de 44 px. La ligne du compte de 50 px en bas.
        - Carte principale grise au rayon 24, sans bord ni ombre ; sur
          `/bot/:id` ou `/g/:id`, la colonne de lecture du fil (48rem, 56rem
          au-delà de 100rem), ses messages et le composer.
        - Sur `/settings/...` : le menu des réglages à la place des
          conversations, « Salon › rubrique » dans la barre, et le corps de
          la rubrique (tuiles et graphiques d'Activité, une carte ailleurs).
        - Rail de 56 px (variante C) : Salon et À traiter en haut ; en bas le
          runtime, le thème, la langue, Réglages et la déconnexion.
        Les couleurs sont les jetons `--bui-*` de `styles/components/boardui.css`
        et les rampes `--accent-*` de `browser/ui-kit/src/styles/app.css`,
        recopiés ici parce que ces CSS ne sont pas encore chargés.

        Seul ce qui DÉPEND DE DONNÉES pulse (`i`). Le décor toujours identique
        (boutons, icônes, libellés de navigation, accent choisi) est peint tel
        qu'il sera (`b`).
      */
      #openedbot-boot {
        display: none;
      }

        --boot-card-edge: lab(15.7305% 0.613764 -2.16959);
        --boot-raised: lab(15.204% 0 0);
        --boot-shape: lab(15.204% 0 0);
        --boot-text: lab(98.26% 0 0);
        --boot-text-3: lab(34.924% 0 0);
        --boot-divider: lab(27.036% 0 0);
        --boot-tile: rgb(38, 38, 38);
        --boot-tile-edge: rgb(255 255 255 / 0.1);

      }
      #openedbot-boot .foot {
        margin-top: 6px;
      }
      #openedbot-boot .foot .row {
        height: 50px;
        padding: 8px 10px;
      }
      #openedbot-boot .foot .face {
        flex-basis: 26px;
        height: 26px;
      }
      #openedbot-boot .main {
        display: flex;
        flex: 1;
        min-width: 0;
        padding: 0 12px 12px;
      }
      #openedbot-boot .scene {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
        border-radius: 24px;
        background: var(--boot-surface);
      }
      /* La colonne de lecture (`data-thread-column`, thread-timeline.css). */
      /* The grok thread (thread-messages.tsx, thread-theme.css): an operator
         bubble on the right, the answer's bubble on the left (rounded 18,
         `min(80%, 560px)`), its action row and its duration; rows anchored on
         the composer, in the 44rem lane. */
      #openedbot-boot .thread {
        flex: 1;
        flex-direction: column;
        justify-content: flex-end;
        gap: 48px;
        min-height: 0;
        padding: 16px 16px 24px;
        overflow: hidden;
      }
      #openedbot-boot .turn {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: var(--boot-column);
        margin-inline: auto;
      }
      #openedbot-boot .ask {
        align-self: flex-end;
        max-width: min(560px, 100%);
        height: 36px;
        margin-bottom: 44px;
        border-radius: 18px;
      }
      #openedbot-boot .answer {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      #openedbot-boot .answer .bubble {
        max-width: min(80%, 560px);
        border-radius: 18px;
      }
      #openedbot-boot .answer .acts4 {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 32px;
        padding: 0 8px;
      }
      #openedbot-boot .answer .acts4 i {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      #openedbot-boot .answer .dur {
        width: 40px;
        height: 11px;
        margin: 4px 0 0 4px;
      }
      /* The turn rail (`thread-turn-rail.tsx`): one tick per question, on the
         thread's left edge, halfway down the reading area. */
      #openedbot-boot .trail {
        display: none;
      }
      #openedbot-boot.conv .trail {
        position: absolute;
        top: calc(50% - 64px);
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #openedbot-boot .trail i {
        width: 16px;
        height: 2px;
        border-radius: 1px;
      }
      /* grok's composer (`max-w-[752px]`, 104 px, rounded 24, its own fill). */
      #openedbot-boot .composer {
        padding: 8px 16px 20px;
      }
      #openedbot-boot .shell {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        max-width: calc(var(--boot-column) + 3rem);
        height: 104px;
        margin-inline: auto;
        padding: 0 10px 10px;
        border: 1px solid var(--boot-composer-edge);
        border-radius: 24px;
        background: var(--boot-composer);
      }
      #openedbot-boot .shell .line {
        width: 120px;
        height: 14px;
        margin: 21px 0 0 9px;
      }
      #openedbot-boot .shell .tools {
        display: flex;
        align-items: center;
      }
      #openedbot-boot .shell .plus {
        display: flex;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        color: var(--boot-icon);
      }
      #openedbot-boot .shell .plus svg {
        width: 20px;
        height: 20px;
      }
      #openedbot-boot .shell .send {
        width: 40px;
        height: 40px;
      }
      #openedbot-boot .shell .gap {
        flex: 1;
      }
      /* Barre latérale repliée : sa rangée d'outils monte dans la barre du haut. */
      html[data-openedbot-sidebar-collapsed] #openedbot-boot .side,
      html[data-openedbot-sidebar-collapsed] #openedbot-boot .org {
        display: none;
      }
      html[data-openedbot-sidebar-collapsed] #openedbot-boot .bartools {
        display: flex;
      }
      /* Variante C (dev) : le rail de 56 px sur toute la hauteur (`BoardIconRail`,
         board-rails.tsx), sans organisation dans la barre ; en tête de liste,
         la recherche et le « + », Salon et À traiter passent dans le rail. */
      #openedbot-boot .brail {
        display: none;
      }
      html[data-openedbot-boot-rail] #openedbot-boot {
        padding-inline-start: 56px;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .brail {
        position: absolute;
        inset-block: 0;
        inset-inline-start: 0;
        display: flex;
        width: 56px;
        flex-direction: column;
        align-items: center;
        padding-bottom: 12px;
      }
      #openedbot-boot .brail .logo {
        display: flex;
        flex: 0 0 46px;
        align-items: center;
      }
      /* macOS : les feux couvrent la rangée du logo du rail, l'application le
         masque (native-titlebar.css) et la barre ne leur réserve que ce qui
         dépasse du rail (16 px, plus 4 px d'écart jusqu'au repli). */
      html[data-openedbot-boot-titlebar="mac"] #openedbot-boot .brail .logo img {
        visibility: hidden;
      }
      html[data-openedbot-boot-titlebar="mac"][data-openedbot-boot-rail] #openedbot-boot .bar::before {
        flex-basis: 16px;
      }
      /* Le bloub passe juste après les feux, avant le repli (`TitlebarLogo`,
         native-titlebar.css). */
      #openedbot-boot .bar .tlogo {
        display: none;
      }
      html[data-openedbot-boot-titlebar="mac"][data-openedbot-boot-rail] #openedbot-boot .bar .tlogo {
        display: block;
        flex: 0 0 22px;
        width: 22px;
        height: 22px;
        margin-inline-end: 8px;
        object-fit: contain;
      }
      html.dark #openedbot-boot .bar .tlogo {
        filter: invert(1) hue-rotate(180deg);
      }
      /* Match the loaded app before its brand stylesheet arrives. */
      html.dark #openedbot-boot .brail .logo img {
        filter: invert(1) hue-rotate(180deg);
      }
      #openedbot-boot .brail .grp {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #openedbot-boot .brail .grp b {
        position: relative;
        display: flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        color: var(--boot-icon);
      }
      #openedbot-boot .brail svg {
        width: 18px;
        height: 18px;
      }
      /* Le runtime : pastille neutre, comme pendant sa première lecture. */
      #openedbot-boot .brail .runtime .dot {
        position: absolute;
        right: 4px;
        bottom: 4px;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--boot-dot);
        box-shadow: 0 0 0 2px var(--boot-full);
      }
      /* The LLM quotas (`RailLlmQuotasLoading`): each brand mark, dimmed, in a
         neutral ring, until the first reading fills them. */
      #openedbot-boot .brail .quota {
        animation: openedbot-boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #openedbot-boot .brail .quota .ring {
        position: absolute;
        inset: 4px;
        width: 28px;
        height: 28px;
        fill: none;
        stroke: var(--boot-text);
        stroke-width: 2;
        opacity: 0.15;
      }
      #openedbot-boot .brail .quota .mark {
        width: 14px;
        height: 14px;
        opacity: 0.35;
      }
      #openedbot-boot .brail .sep {
        width: 20px;
        height: 1px;
        margin: 2px 0;
        background: var(--boot-divider);
      }
      #openedbot-boot svg.tb {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #openedbot-boot .brail .gap {
        flex: 1;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .org,
      html[data-openedbot-boot-rail] #openedbot-boot .nav,
      html[data-openedbot-boot-rail] #openedbot-boot .foot {
        display: none;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .side {
        padding-inline-start: 0;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .top {
        display: flex;
        margin-bottom: 4px;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .top b {
        height: 32px;
        border-radius: 8px;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .top b.search {
        flex: 1;
        justify-content: flex-start;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        padding-inline-start: 10px;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .top > span {
        display: none;
      }
      #openedbot-boot .top .ph {
        display: none;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .top .ph {
        display: block;
        overflow: hidden;
        font-size: 13px;
        font-weight: 500;
        line-height: 18px;
        color: var(--boot-text-3);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .top b.create {
        flex: 0 0 32px;
        border-radius: 999px;
      }
      html[data-openedbot-boot-rail] #openedbot-boot .top svg {
        width: 16px;
        height: 16px;
      }
      /* Une rubrique des réglages (`SettingsFrame`) : le menu des réglages à la
         place des conversations (`SettingsPageSidebar`), « Salon › rubrique »
         dans la barre, et le corps dans la carte : tuiles et graphiques sur
         Activité (`OverviewBodySkeleton`), une carte ailleurs
         (`SettingsBodySkeleton`). Mêmes mesures que le vrai menu : boutons de
         36 px, groupes espacés de 20 px, intitulé de 20 px. */
      #openedbot-boot .snav,
      #openedbot-boot .pane {
        display: none;
      }
      html[data-openedbot-booting] #openedbot-boot.settings .top,
      html[data-openedbot-booting] #openedbot-boot.settings .nav,
      html[data-openedbot-booting] #openedbot-boot.settings .rows,
      html[data-openedbot-booting] #openedbot-boot.settings .foot {
        display: none;
      }
      /* Le menu des réglages reste ouvert même barre repliée, avec sa marge de 12 px. */
      html[data-openedbot-booting] #openedbot-boot.settings .side {
        display: flex;
        padding-inline-start: 12px;
      }
      #openedbot-boot.settings .snav {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
        overflow: hidden;
      }
      #openedbot-boot .sitem {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 8px;
        border-radius: 10px;
        color: var(--boot-text-2);
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }
      #openedbot-boot .sitem.on {
        background: var(--boot-shape);
        color: var(--boot-text);
      }
      #openedbot-boot .sitem svg {
        flex: 0 0 20px;
        height: 20px;
        color: var(--boot-icon);
      }
      #openedbot-boot .sitem span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #openedbot-boot .sgrp {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 4px;
      }
      #openedbot-boot .sgrp > span {
        padding-inline-start: 8px;
        color: var(--boot-text-2);
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }
      #openedbot-boot .sgrp > div {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #openedbot-boot.settings .crumb {
        display: flex;
      }
      #openedbot-boot.settings .crumb .title {
        color: var(--boot-text);
        font-weight: 600;
        white-space: nowrap;
      }
      #openedbot-boot.settings .pane.section,
      #openedbot-boot.settings.overview .pane.overview {
        display: flex;
      }
      #openedbot-boot.settings.overview .pane.section {
        display: none;
      }
      /* `SettingsPane` dans `SettingsPage` (24 px en haut ; 12 px de côté, 16 px dès 1024 px) ; les tuiles et les graphiques suivent la
         largeur de la page, comme `@container/main` : 2 colonnes dès 36rem,
         4 tuiles et 2 graphiques dès 64rem. */
      #openedbot-boot .pane {
        flex: 1;
        flex-direction: column;
        gap: 24px;
        min-height: 0;
        padding: 24px 12px;
        overflow: hidden;
        container-type: inline-size;
      }
      @media (min-width: 1024px) {
        #openedbot-boot .pane {
          padding-inline: 16px;
        }
      }
      /* Activité déborde toujours (tableau des bots, configuration) : la vraie
         page porte une barre de défilement fine, sa place est réservée ici. */
      #openedbot-boot .pane.overview {
        scrollbar-width: thin;
        scrollbar-gutter: stable;
      }
      #openedbot-boot .tiles {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      #openedbot-boot .charts {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }
      @container (min-width: 36rem) {
        #openedbot-boot .tiles {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @container (min-width: 64rem) {
        #openedbot-boot .tiles {
          grid-template-columns: repeat(4, 1fr);
        }
        #openedbot-boot .charts {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      #openedbot-boot .tile,
      #openedbot-boot .chart,
      #openedbot-boot .scard {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--boot-tile-edge);
        border-radius: 14px;
        background: var(--boot-tile);
      }
      /* Les barres d'une carte, d'un cran plus claires (`ON_CARD`, overview-skeleton.tsx). */
      #openedbot-boot .tile i,
      #openedbot-boot .chart i,
      #openedbot-boot .scard i {
        background: var(--boot-tile-shape);
      }
      #openedbot-boot .tile {
        justify-content: space-between;
        height: 140px;
        padding: 16px;
      }
      #openedbot-boot .tile .head,
      #openedbot-boot .chart .head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      /* Titre de 14 px, puis des lignes de description de 20 px. */
      #openedbot-boot .chart .head > div {
        display: flex;
        flex-direction: column;
      }
      #openedbot-boot .chart .head .d {
        height: 14px;
        margin: 3px 0;
      }
      #openedbot-boot .chart .head > div > i:first-child {
        margin-bottom: 5px;
      }
      #openedbot-boot .tile .foot2 {
        display: grid;
        gap: 6px;
      }
      #openedbot-boot .chart {
        gap: 24px;
        min-height: 390px;
        padding: 24px;
      }
      #openedbot-boot .chart.tokens {
        min-height: 410px;
      }
      #openedbot-boot .chart .plot {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 250px;
        margin-top: auto;
      }
      #openedbot-boot .chart .plot > i {
        flex: 1;
      }
      #openedbot-boot .chart .ticks {
        display: flex;
        justify-content: space-between;
        padding: 0 8px;
      }
      #openedbot-boot .chart .ticks i {
        width: 40px;
        height: 12px;
      }
      #openedbot-boot .scard {
        gap: 12px;
        border-radius: 12px;
        padding: 16px;
      }
      #openedbot-boot .scard .row40 {
        height: 40px;
        border-radius: 8px;
      }
      /* Téléphone : `MobileFrame` range la barre dans un tiroir, la scène occupe tout. */
      @media (max-width: 767px) {
        #openedbot-boot .bar,
        #openedbot-boot .side,
        html[data-openedbot-boot-rail] #openedbot-boot .brail {
          display: none;
        }
        html[data-openedbot-boot-rail] #openedbot-boot {
          padding-inline-start: 0;
        }
        #openedbot-boot .main {
          padding: 0;
        }
        #openedbot-boot .scene {
          border-radius: 0;
        }
        #openedbot-boot.conv .thread,
        #openedbot-boot.conv .composer,
        #openedbot-boot.conv .trail {
          display: none;
        }
      }
      @keyframes openedbot-boot-pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #openedbot-boot i,
        #openedbot-boot .brail .quota {
          animation: none;
        }
      }
    </style>
  </head>

    <script>
      // Ce que la page ne connaît qu'au chargement : la langue des libellés,
      // la forme du dernier roster (`lib/session/boot-shape.ts`, mêmes bornes) et si
      // l'adresse est une conversation (`isConversationPath`).
      (function () {
        var boot = document.getElementById("openedbot-boot");
        if (!boot) return;
        try {
          var locale = localStorage.getItem("openedbot:locale") || (navigator.language || "").slice(0, 2).toLowerCase();
          if (locale === "en") {
            boot.setAttribute("aria-label", "Loading");
            boot.querySelector(".inbox").textContent = "Inbox";
            boot.querySelector(".top .ph").textContent = "Search conversations…";
          }
          if (/\/(?:bot|g)\/[^/]+\/?$/.test(location.pathname)) boot.className = "conv";
          // Une rubrique des réglages : `settingsPathOf` (frame-skeletons.tsx).
          var internal = location.pathname.replace(/^\/o\/[^/]+/, "").replace(/\/+$/, "") || "/";
          if (internal === "/settings" || internal.indexOf("/settings/") === 0) {
            boot.className = internal === "/settings" ? "settings overview" : "settings";
            if (locale === "en") {
              var english = {
                leave: "Leave settings", me: "Me", workspace: "Workspace", bots: "Bots and runtime", control: "Control",
                "/settings/account": "My account", "/settings/appearance": "Appearance and language", "/settings": "Activity",
                "/settings/models": "Models", "/settings/connectors": "Connectors", "/settings/policies": "Policies",
                "/settings/decisions": "Decisions", "/settings/security": "Security"
              };
              boot.querySelectorAll(".snav [data-l]").forEach(function (node) {
                var text = english[node.getAttribute("data-l")];
                if (text) node.textContent = text;
              });
            }
            // La rubrique ouverte, comme `isSettingsEntryActive` (Runtime couvre aussi l'import des agents).
            var section = internal === "/settings/agents" ? "/settings/runtime" : internal;
            boot.querySelectorAll(".snav [data-url]").forEach(function (node) {
              var url = node.getAttribute("data-url");
              if (url === "/settings" ? section === url : section === url || section.indexOf(url + "/") === 0) {
                node.className += " on";
                var title = boot.querySelector(".crumb .title");
                title.textContent = node.textContent;
              }
            });
          }
          try {
            var identity = JSON.parse(localStorage.getItem("openedbot:boot-identity") || "null");
            var session = JSON.parse(localStorage.getItem("openedbot:cloud-session") || "null");
            var orgSlot = boot.querySelector(".org i");
            if (orgSlot && identity && session && typeof identity.label === "string" && identity.label
              && typeof identity.userId === "string" && identity.userId === session.userId) {
              var orgName = document.createElement("span");
              orgName.className = "orgname";
              orgName.textContent = identity.label.slice(0, 64);
              orgSlot.replaceWith(orgName);
            }
          } catch (e) { /* the label keeps pulsing */ }
          var shape = null;
          try { shape = JSON.parse(localStorage.getItem("openedbot:boot-sidebar") || "null"); } catch (e) { shape = null; }
          if (!shape || typeof shape.pins !== "number" || !Array.isArray(shape.blocks)) shape = { pins: 0, blocks: [{ label: true, rows: 5 }] };
          var rows = boot.querySelector(".rows");
          var html = "";
          var pins = Math.max(0, Math.min(Math.floor(shape.pins), 6));
          if (pins > 0) {
            html += '<div class="pins">';
            for (var p = 0; p < pins; p++) html += '<div class="pin"><i class="face"></i><i style="width:64px;height:14px"></i></div>';
            html += "</div>";
          }
          var left = 18;
          for (var b = 0; b < shape.blocks.length && left > 0; b++) {
            var block = shape.blocks[b] || {};
            var count = Math.max(0, Math.min(Math.floor(Number(block.rows) || 0), left));
            left -= count;
            html += '<div class="block">';
            if (block.label === true) html += '<div class="label"><i style="width:64px;height:12px"></i></div>';
            for (var r = 0; r < count; r++) html += '<div class="row"><i class="face"></i><div class="lines"><i class="l1"></i><i class="l2"></i></div></div>';
            html += "</div>";
          }
          rows.innerHTML = html;
        } catch (e) {
          // Sans localStorage : la forme par défaut, cinq rangées sous un intitulé.
          var fallback = '<div class="block"><div class="label"><i style="width:64px;height:12px"></i></div>';
          for (var d = 0; d < 5; d++) fallback += '<div class="row"><i class="face"></i><div class="lines"><i class="l1"></i><i class="l2"></i></div></div>';
          boot.querySelector(".rows").innerHTML = fallback + "</div>";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
