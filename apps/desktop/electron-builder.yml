# Sideload builds: unsigned Windows x64 (zip, NSIS), macOS arm64 (dmg, zip) and
# Linux x64 (AppImage, deb). No auto-update feed. The macOS app is signed ad hoc
# here; electron-builder.developer-id.yml signs it with the Developer ID and
# notarises it (the releases). SmartScreen still warns on first run.
# .github/workflows/desktop-release.yml builds the macOS and Linux files.
appId: app.openedbot.desktop
productName: openedbot
copyright: Copyright (c) 2026 Kévin Aubrée

directories:
  output: release/

# The main process loads src/renderer/signin.html straight from the app
# archive (tsc only emits TypeScript), so that folder ships next to dist/.
files:
  - dist/**
  - src/renderer/**
  - package.json
  - LICENSE
  - NOTICE

asar: true

# Never publish from here: artifacts are copied by hand.
publish: null

# Two artifacts from the same win-unpacked tree. The zip is the portable test
# build (unzip, run openedbot.exe) and needs no Wine when cross-building from
# Linux; the NSIS installer does (makensis runs through Wine), see Makefile.
win:
  target:
    - target: zip
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # The bloub (apps/console/public/brand/openedbot-bloub.svg) on a white tile; electron-builder derives the .ico.
  # With signAndEditExecutable off, openedbot.exe itself keeps the Electron icon in
  # Explorer: only the installer uses this one. The running window and taskbar
  # get it from BrowserWindow `icon` (src/main/window.ts).
  icon: src/renderer/icon.png
  # No certificate: skip signing and the rcedit pass (which needs Wine when
  # cross-building from Linux).
  signAndEditExecutable: false

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false

# macOS, Apple Silicon. Signed ad hoc, not notarized: Gatekeeper blocks the first
# launch of a downloaded copy (System Settings > Privacy & Security > Open Anyway).
# That is the build without the certificate (pull requests, forks, a Mac
# without it); releases use electron-builder.developer-id.yml on top of this.
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Ad hoc ("-"), not null: an unsigned bundle whose Electron seal was broken by
  # packaging (Info.plist, the embedded popup) is reported "damaged" once
  # downloaded, with no way to open it; a consistent ad hoc signature gets the
  # "Open Anyway" path instead. Hardened runtime off: with an ad hoc identity it
  # enforces library validation, which rejects the Electron frameworks.
  identity: "-"
  hardenedRuntime: false
  # Registers openedbot:// with Launch Services so the Google return lands here.
  protocols:
    - name: openedbot
      schemes:
        - openedbot
  # The popup (openedbot Notch) is built in its own repository,
  # OpenedBot/openedbot-notch (`make -C $NOTCH_DIR bundle`), and embedded as
  # is, never as source: `make package-mac` checks it and stages it in
  # popup-bundle/. src/main/popup-host.ts runs Contents/Helpers/OpenedbotPopup.app/Contents/MacOS/OpenedbotPopup
  # with --hosted. extraFiles is relative to Contents/ on macOS.
  extraFiles:
    - from: popup-bundle/OpenedbotPopup.app
      to: Helpers/OpenedbotPopup.app

# Linux x64: an AppImage (any distribution, nothing to install) and a .deb
# (Debian, Ubuntu). Unsigned. The window, tray and menus follow the Windows
# path (src/main): no popup, which is macOS only.
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  executableName: openedbot
  # The hicolor sizes, so every launcher and dock picks a sharp one
  # (rendered from apps/console/public/brand/openedbot-bloub.svg, like icon.png).
  icon: build/icons
  # Electron reports desktopName (package.json) as the window's app_id / WM_CLASS.
  # The .desktop entry must carry that same name, or GNOME (Wayland above all)
  # cannot tie the running window to its launcher and shows a generic icon.
  syncDesktopName: true
  category: Office
  synopsis: Drive your AI agents from a native window
  # The .deb control file needs a maintainer; package.json has no author.
  maintainer: openedbot <no-reply@openedbot.app>
  vendor: openedbot
  # The .desktop entry declares x-scheme-handler/openedbot, so the desktop opens the
  # Google return (openedbot://auth/callback) with this app once it is installed
  # (.deb, or an AppImage integrated by the desktop). Otherwise
  # setAsDefaultProtocolClient fails and src/main/deep-link.ts falls back to the
  # loopback callback.
  protocols:
    - name: openedbot
      schemes:
        - openedbot
