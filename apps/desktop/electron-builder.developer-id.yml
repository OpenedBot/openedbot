# Developer ID build of the macOS app: `make package-mac MAC_SIGN=developer-id`
# (the release path of .github/workflows/desktop-release.yml). Everything else
# comes from electron-builder.yml; this file only turns the ad hoc signature
# into a Developer ID one that Gatekeeper accepts on a downloaded copy.
#
# The certificate comes from the login keychain on a Mac. The CI imports its
# .p12 into a keychain of the run and passes it as CSC_KEYCHAIN (not CSC_LINK:
# electron-builder 26 mishandles its own temporary keychain). Notarisation reads APPLE_API_KEY (path of the
# App Store Connect .p8), APPLE_API_KEY_ID and APPLE_API_ISSUER; the Makefile
# refuses to start without them, since electron-builder would otherwise skip
# notarisation with a mere warning.
extends: ./electron-builder.yml

mac:
  # electron-builder adds the "Developer ID Application:" prefix itself and
  # refuses it here. Without that certificate it falls back to another one of
  # the team (Apple Distribution); scripts/check-mac-app.sh then fails on the
  # Authority, and notarisation would refuse the build anyway.
  identity: "kevin aubrée (QDC76LMF29)"
  type: distribution
  # Required by notarisation. Entitlements: build/entitlements.mac*.plist.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Every nested binary, the notch popup included, is re-signed with this
  # identity, the hardened runtime and a secure timestamp (codesign
  # --timestamp), then the app is notarised and its ticket stapled before the
  # dmg and zip are built.
  notarize: true

# The dmg itself is signed too, so it can be notarised and stapled in turn
# (scripts/notarize-dmg.sh): Gatekeeper then checks it offline.
dmg:
  sign: true
