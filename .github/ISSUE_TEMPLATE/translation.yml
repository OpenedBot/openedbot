name: Translation
description: Report a wrong, missing or awkward translation, or offer a new language.
labels: ["i18n"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Wrong or awkward wording
        - Untranslated text
        - New language
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. French (fr), English (en)
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it appears
      description: The screen, e-mail or message, and the message key if you know it (contracts/i18n/src/messages).
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
