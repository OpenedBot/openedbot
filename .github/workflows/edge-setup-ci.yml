# Contrôles d'edge-setup dans le monorepo OpenedBot/openedbot. edge-setup/,
# docs/ (site de documentation, miroir de edge-setup/docs) et le cœur (moitié
# TypeScript du contrat du lien) sont dans le même dépôt : un seul checkout,
# plus de clé de déploiement. Actions épinglées par SHA ; Go épinglé par go.mod.
name: edge-setup-ci

on:
  # No trigger-level `paths`: a filtered-out workflow reports no check at all,
  # which leaves a required check pending forever. The `changes` job below
  # applies the same path list per job, and `ci-ok` is the one check to require.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-setup-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: edge-setup

jobs:
  changes:
    # Same path list as the former trigger filter. Anything that cannot be
    # diffed (manual run, new branch, missing base) counts as relevant.
    name: Changes (path filter)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="$BASE...$HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          fi
          if [ -z "$range" ]; then
            echo "no diffable range ($EVENT): every job runs"
            relevant=true
          else
            files=$(git diff --name-only "$range")
            printf '%s\n' "$files"
            # Here-string, not a pipe: under pipefail, grep -q closing early
            # could fail the producer and turn a match into "not relevant".
            if grep -qE '^(edge-setup/|docs/|platform/hermes/|modules/runtimes/|contracts/)|^(Makefile|package\.json|bun\.lock|\.github/workflows/edge-setup-ci\.yml)$' <<<"$files"; then
              relevant=true
            else
              relevant=false
            fi
          fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  static:
    name: Static (gofmt, vet, staticcheck, govulncheck)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge-setup/go.mod
          cache-dependency-path: edge-setup/go.sum
      - name: Install staticcheck and govulncheck (pinned versions and h1 sums)
        # Versions and module sums live in edge-setup/Makefile
        # (STATICCHECK_VERSION/SUM, GOVULNCHECK_VERSION/SUM); lint-tools
        # installs them and checks the sum recorded in each binary.
        run: make lint-tools
      - run: make lint LINT_STRICT=1
      - name: Integration tests compile
        run: go vet -tags integration ./test/integration/...

  test:
    name: Tests (unit, docs mirror, release assets and publication)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The binary version comes from `git describe --tags --match 'edge-setup/v*'`.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge-setup/go.mod
          cache-dependency-path: edge-setup/go.sum
      - run: make test
      - run: make test-release

  contract:
    name: Connector contract (Go and TypeScript halves)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge-setup/go.mod
          cache-dependency-path: edge-setup/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install the locked OpenedBot workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - run: make contract-check

  build:
    name: Build (build-all)
    needs: [changes, static, test, contract]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge-setup/go.mod
          cache-dependency-path: edge-setup/go.sum
      - run: make build-all

  scripts:
    name: Scripts (shellcheck, install bootstrap)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck v0.11.0 (pinned by SHA-256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          echo "$PWD/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: make shellcheck
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install bootstrap (valid, invalid and missing signature, dry-run, pinned version)
        working-directory: docs
        run: bun test tests/install.test.ts

  e2e:
    # A privileged systemd container per distribution: read-only commands,
    # up, the previews, uninstall (data kept, revocation attempted against an
    # unreachable origin) and reset. Docker rootless and cgroup limits need a
    # VM: make integration-vm.
    name: E2E (${{ matrix.base }})
    needs: [changes, static, test]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        base: ["ubuntu:24.04", "ubuntu:26.04", "debian:trixie"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge-setup/go.mod
          cache-dependency-path: edge-setup/go.sum
      - run: make build
      - name: Integration scenarios
        env:
          EDGE_SETUP_IT_BASE: ${{ matrix.base }}
        run: go test -tags integration -count=1 -timeout 70m -run 'TestReadOnlyCommandsOnFreshHost|TestUpConnectorNoSSHHardening' -v ./test/integration/

  ci-ok:
    # The single required check. It always runs and passes only when the path
    # filter succeeded and every job either succeeded or was skipped because
    # nothing relevant changed. A failed or cancelled job fails it, and so
    # does a skipped job when the change was relevant.
    name: edge-setup-ci ok
    if: always()
    needs: [changes, static, test, contract, build, scripts, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job result
        working-directory: .
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            (.changes.result == "success") and
            (.changes.outputs.relevant == "true" or .changes.outputs.relevant == "false") and
            ( if .changes.outputs.relevant == "true"
              then ([del(.changes)[] | .result] | all(. == "success"))
              else ([del(.changes)[] | .result] | all(. == "success" or . == "skipped"))
              end )' > /dev/null
