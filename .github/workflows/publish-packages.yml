# Publication of the shared core packages (contracts/*, platform/*) to GitHub
# Packages, PREPARED ONLY (open-core step 8).
#
# - Manual only (workflow_dispatch) and only under the future org OpenedBot.
# - Publishes nothing: every package is still `private: true`. They are named
#   @openedbot/*, the scope of the owning org that GitHub Packages requires.
#   TODO(publish): once publishing is decided, flip `private`, replace the
#   dry run below by `bun publish` and grant `packages: write`.
# - Uses no secret: until then the job only needs to read the repository.
# - Actions pinned by SHA, like the other workflows.
name: publish-packages (dry run)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.repository_owner == 'OpenedBot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Pack each package without publishing
        run: |
          for dir in contracts/* platform/*; do
            [ -f "$dir/package.json" ] || continue
            echo "::group::$dir"
            (cd "$dir" && bun pm pack --dry-run)
            echo "::endgroup::"
          done
