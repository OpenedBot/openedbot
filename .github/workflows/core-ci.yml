# Contrôles du cœur TypeScript (apps, platform, contracts, modules, browser,
# tests, scripts) : typecheck, tests unitaires, frontières et licences, puis
# tests d'intégration contre un PostgreSQL jetable ; et le shell Rust de l'app
# de bureau (cargo test, clippy) sur macOS. Aucun plug-in pro
# (./plugins) en CI : le cœur tourne en solo, c'est attendu. Aucun secret,
# aucun .env.local : les cibles make tournent sur leurs valeurs par défaut.
# Actions épinglées par SHA ; Bun épinglé par packageManager (package.json).
name: core-ci

on:
  # No trigger-level `paths`: a filtered-out workflow reports no check at all,
  # which leaves a required check pending forever. `core-ci ok` is the one
  # check to require.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  # A new push to a PR cancels its obsolete run; every commit on main keeps
  # its own complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: make typecheck

  unit:
    # Includes tests/scripts/make-dev-contract.sh (real `make dev` with
    # stubbed launchers and a temporary env file), the Python provider-fault
    # test (python3 ships with ubuntu-24.04) and the vite build-id test, which
    # needs git (also preinstalled).
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: make test-unit

  bundle:
    # A solo console build held under the bundle budgets of ADR 0001 (G2):
    # entry chunk and first load, gzip (apps/console/scripts/bundle-budget.ts).
    name: Console bundle budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: make bundle-budget

  deps:
    name: Dependency boundaries and licences
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: make deps-check

  integration:
    # Migrations, tenant RLS, replays and queues against a throwaway
    # PostgreSQL, same major and image as the dev-infra container. With
    # INTEGRATION_DATABASE_URL set, `make test-integration` skips db-up (no
    # docker), postgres-rls.sh creates the roles and the openedbot_integration
    # database through the admin URL and drops it on exit, and every bun
    # script creates and drops its own uniquely named database. Trust auth
    # keeps any password out of this file: the service lives only as long as
    # this job, on an ephemeral runner with no inbound access.
    name: Integration tests (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      INTEGRATION_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      INTEGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/openedbot_integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # run-trace-correlation.ts builds and runs the real edge-setup connector.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge-setup/go.mod
          cache-dependency-path: edge-setup/go.sum
      - name: PostgreSQL client and server versions
        # postgres-rls.sh drives psql (the runner's preinstalled client).
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -At "$INTEGRATION_ADMIN_DATABASE_URL" -c 'show server_version'
      - run: make test-integration

  desktop-tauri:
    # The Rust shell of the desktop app (ADR 0001, 4.8): cargo test (IPC
    # refusals, single-flight refresh, keystore, popup host, Google door,
    # diagnostics, bindings up to date) and clippy -D warnings. On macOS: the
    # shell's macOS modules (menus, Dock menu, WebKit purge, objc2) only
    # compile there, and the placeholder console of `build.rs` stands in for
    # the console build. Toolchain from rustup (preinstalled on the runner).
    name: Desktop shell (Rust)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          cargo --version && cargo clippy --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop-tauri/src-tauri/target
          key: desktop-tauri-${{ runner.os }}-${{ hashFiles('apps/desktop-tauri/src-tauri/Cargo.lock') }}
          restore-keys: desktop-tauri-${{ runner.os }}-
      - run: make desktop-tauri-check

  ci-ok:
    # The single required check. It always runs and passes only when every
    # job succeeded: a failed, cancelled or skipped job fails it.
    name: core-ci ok
    if: always()
    needs: [typecheck, unit, bundle, deps, integration, desktop-tauri]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success")' > /dev/null
