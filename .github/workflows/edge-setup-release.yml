# Release d'un tag edge-setup/vX.Y.Z du monorepo OpenedBot/openedbot : contrat
# du lien des deux côtés, tests, build, puis signature keyless (cosign, OIDC
# GitHub) de SHA256SUMS et de chaque fichier. Les fichiers signés passent au
# job `publish` par le cache Actions du run (clé exacte, propre au run et à la
# version), jamais par un artefact, pour ne dépendre d'aucun quota de stockage
# d'artefacts. Le cache n'est qu'un
# transport non fiable : chaque job qui publie refuse un ensemble de fichiers
# qui ne correspond pas exactement à SHA256SUMS et revérifie lui-même chaque
# signature pour l'identité du tag avant d'envoyer un octet. Le job `publish`
# publie sur R2 (releases.openedbot.app/edge-setup) : lui seul lit le jeton R2,
# dans l'environnement GitHub `edge-setup-r2` réservé aux tags edge-setup/v*
# (voir docs/edge-setup-security.md), puis ne garde que les deux dernières
# versions. Le job `github` publie ensuite les mêmes fichiers en release
# GitHub, après avoir vérifié que R2 sert les mêmes empreintes.
# `make publish` reste le chemin manuel.
# L'identité signataire est ce fichier exécuté sur le tag : un hôte refuse toute
# autre identité, donc renommer ce workflow change la racine de confiance.
name: edge-setup-release

on:
  push:
    tags: ["edge-setup/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag à vérifier (edge-setup/vX.Y.Z), déjà poussé"
        required: true

permissions:
  contents: read

concurrency:
  group: edge-setup-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: edge-setup

jobs:
  verify:
    name: Verify, build and sign the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Keyless signature: Fulcio certifies this workflow's OIDC identity.
      id-token: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      # Exact cache key of the signed files: one run, one version. Never a
      # prefix (no restore-keys), so a restore cannot fall back to another run.
      handoff: ${{ steps.v.outputs.handoff }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe` guards the version below; it needs the history.
          fetch-depth: 0
          ref: ${{ github.event.inputs.version || github.ref }}
      - name: Resolve the version
        # The ref goes through the environment, never the script body: `${{ }}`
        # is substituted before the shell reads the line.
        env:
          VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        id: v
        run: |
          tag="$VERSION_INPUT"
          case "$tag" in
            edge-setup/v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected tag: $tag (want edge-setup/vX.Y.Z)" >&2; exit 2 ;;
          esac
          described="$(git describe --tags --exact-match --match 'edge-setup/v*' 2>/dev/null || true)"
          if [ "$described" != "$tag" ]; then
            echo "HEAD is not the tag $tag (git describe: ${described:-nothing})" >&2
            exit 2
          fi
          echo "version=${tag#edge-setup/}" >> "$GITHUB_OUTPUT"
          # The run id, not the attempt: "Re-run failed jobs" keeps this job's
          # outputs and must find the files it saved.
          echo "handoff=edge-setup-signed-${tag#edge-setup/}-run-$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge-setup/go.mod
          cache-dependency-path: edge-setup/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install the locked OpenedBot workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - run: make contract-check
      - run: make test
      - run: make test-release
      - env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make build-all VERSION="$VERSION"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign
        # Only a run on the tag itself carries the identity hosts accept; a
        # dispatch from a branch would sign under another one and fail below.
        if: github.ref == format('refs/tags/edge-setup/{0}', steps.v.outputs.version)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make sign VERSION="$VERSION"
      - name: Verify the signatures as a host does
        if: github.ref == format('refs/tags/edge-setup/{0}', steps.v.outputs.version)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make verify-signatures VERSION="$VERSION"
      - name: Stage exactly the signed files
        if: github.ref == format('refs/tags/edge-setup/{0}', steps.v.outputs.version)
        run: |
          rm -rf signed
          mkdir signed
          cp dist/edge-setup_* dist/install.sh dist/install.sh.sigstore.json dist/SHA256SUMS dist/SHA256SUMS.sigstore.json signed/
          bash scripts/check-signed-dir.sh signed
      # Hand-over to the publishing jobs through the run's Actions cache, not
      # an artifact (artifact storage quota). Same path and key everywhere.
      # A key that already exists (re-run of every job) is kept as it is: its
      # files were signed by this workflow on this tag too, and each consumer
      # verifies them.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == format('refs/tags/edge-setup/{0}', steps.v.outputs.version)
        with:
          path: edge-setup/signed
          key: ${{ steps.v.outputs.handoff }}
      - name: Check that the signed files are stored
        # cache/save only warns when it cannot store: fail here, not in the
        # publishing jobs.
        if: github.ref == format('refs/tags/edge-setup/{0}', steps.v.outputs.version)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: edge-setup/signed
          key: ${{ steps.v.outputs.handoff }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Announce
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          echo "::notice title=Signed::$VERSION verified and signed; the publish job sends these files to https://releases.openedbot.app/edge-setup."
          echo "$VERSION: contract, tests, build and signatures verified." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the signed files to R2
    needs: verify
    # The signed files only exist for a run on the tag itself (see Sign).
    if: github.ref == format('refs/tags/edge-setup/{0}', needs.verify.outputs.version)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the R2 write token (secret CLOUDFLARE_R2_TOKEN) and CF_ACCOUNT_ID;
    # its deployment policy only admits edge-setup/v* tags.
    environment: edge-setup-r2
    permissions:
      # The cache is read with the runner's own token, not GITHUB_TOKEN.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: edge-setup/signed
          key: ${{ needs.verify.outputs.handoff }}
          fail-on-cache-miss: true
      - name: Verify the signatures again, on the bytes about to leave
        # Mandatory, fail closed: the cache is a transport, not a trust anchor.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          bash scripts/check-signed-dir.sh signed
          make verify-signatures VERSION="$VERSION" DIR=signed
      - name: Extract the public notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v head="## $VERSION " 'index($0, head) == 1 { on = 1; next } on && /^## v/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no ## $VERSION entry" >&2; exit 2; }
          make notes-check NOTES_FILE="$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "secret CLOUDFLARE_R2_TOKEN missing: add an R2 API token scoped to the release bucket as secret CLOUDFLARE_R2_TOKEN of the GitHub environment edge-setup-r2" >&2; exit 2; }
          NOTES_FILE="$RUNNER_TEMP/notes.md" bash scripts/publish-r2.sh "$VERSION" signed
          echo "$VERSION published: https://releases.openedbot.app/edge-setup/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

  github:
    name: Publish the same signed files as a GitHub release
    needs: [verify, publish]
    # R2 first (hosts read it), then GitHub with the very same bytes: a
    # release exists in both places, identical, or the run fails.
    if: github.ref == format('refs/tags/edge-setup/{0}', needs.verify.outputs.version)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: edge-setup/signed
          key: ${{ needs.verify.outputs.handoff }}
          fail-on-cache-miss: true
      - name: Verify the signatures, on the bytes about to leave
        # Mandatory, fail closed, as in the publish job.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          bash scripts/check-signed-dir.sh signed
          make verify-signatures VERSION="$VERSION" DIR=signed
      - name: Check that R2 serves the same files
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          curl -fsS --retry 3 "https://releases.openedbot.app/edge-setup/$VERSION/SHA256SUMS" -o "$RUNNER_TEMP/r2-SHA256SUMS"
          cmp signed/SHA256SUMS "$RUNNER_TEMP/r2-SHA256SUMS" || { echo "R2 and this run disagree on SHA256SUMS for $VERSION" >&2; exit 1; }
          (cd signed && sha256sum -c SHA256SUMS)
      - name: Extract the public notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v head="## $VERSION " 'index($0, head) == 1 { on = 1; next } on && /^## v/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no ## $VERSION entry" >&2; exit 2; }
          printf '\nThe same signed files are served by https://releases.openedbot.app/edge-setup/%s/.\n' "$VERSION" >> "$RUNNER_TEMP/notes.md"
      - name: Publish or verify the existing release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/publish-github.sh "$VERSION" signed "$RUNNER_TEMP/notes.md"
          TAG="edge-setup/$VERSION"
          echo "Release $TAG: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
