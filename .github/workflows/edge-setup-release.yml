# Release d'un tag edge-setup/vX.Y.Z du monorepo OpenedBot/openedbot : contrat
# du lien des deux côtés, tests, build, puis signature keyless (cosign, OIDC
# GitHub) de SHA256SUMS et de chaque fichier. Les fichiers signés partent en
# artefact du run ; ce workflow ne publie rien. L'opérateur publie ces octets-là
# avec `make publish VERSION=vX.Y.Z` (jeton R2 hors CI, edge-setup/docs/RELEASING.md).
# L'identité signataire est ce fichier exécuté sur le tag : un hôte refuse toute
# autre identité, donc renommer ce workflow change la racine de confiance.
name: edge-setup-release

on:
  push:
    tags: ["edge-setup/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag à vérifier (edge-setup/vX.Y.Z), déjà poussé"
        required: true

permissions:
  contents: read

concurrency:
  group: edge-setup-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: edge-setup

jobs:
  verify:
    name: Verify, build and sign the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Keyless signature: Fulcio certifies this workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe` guards the version below; it needs the history.
          fetch-depth: 0
          ref: ${{ github.event.inputs.version || github.ref }}
      - name: Resolve the version
        # The ref goes through the environment, never the script body: `${{ }}`
        # is substituted before the shell reads the line.
        env:
          VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}
        id: v
        run: |
          tag="$VERSION_INPUT"
          case "$tag" in
            edge-setup/v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected tag: $tag (want edge-setup/vX.Y.Z)" >&2; exit 2 ;;
          esac
          described="$(git describe --tags --exact-match --match 'edge-setup/v*' 2>/dev/null || true)"
          if [ "$described" != "$tag" ]; then
            echo "HEAD is not the tag $tag (git describe: ${described:-nothing})" >&2
            exit 2
          fi
          echo "version=${tag#edge-setup/}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: edge-setup/go.mod
          cache-dependency-path: edge-setup/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install the locked OpenedBot workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - run: make contract-check
      - run: make test
      - run: make test-release
      - env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make build-all VERSION="$VERSION"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign
        # Only a run on the tag itself carries the identity hosts accept; a
        # dispatch from a branch would sign under another one and fail below.
        if: github.ref == format('refs/tags/edge-setup/{0}', steps.v.outputs.version)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make sign VERSION="$VERSION"
      - name: Verify the signatures as a host does
        if: github.ref == format('refs/tags/edge-setup/{0}', steps.v.outputs.version)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make verify-signatures VERSION="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == format('refs/tags/edge-setup/{0}', steps.v.outputs.version)
        with:
          name: edge-setup-${{ steps.v.outputs.version }}
          path: |
            edge-setup/dist/edge-setup_*
            edge-setup/dist/install.sh*
            edge-setup/dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 30
      - name: Announce
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          echo "::notice title=Signed::$VERSION verified and signed. Publish these files: make publish VERSION=$VERSION (origin https://releases.openedbot.app/edge-setup)."
          echo "$VERSION: contract, tests, build and signatures verified. Publication: make publish VERSION=$VERSION." >> "$GITHUB_STEP_SUMMARY"
